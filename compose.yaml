services:
  stickatelier:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1455:1455"
    volumes:
      - atelier-data:/data
    secrets:
      - atelier_password
    environment:
      ATELIER_DATA: /data
      ATELIER_PASSWORD_FILE: /run/secrets/atelier_password
      ATELIER_COOKIE_SECURE: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 1g
volumes:
  atelier-data:
secrets:
  atelier_password:
    file: ./password.txt
